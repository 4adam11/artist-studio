name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - install
        run: npm ci
        working-directory: server
      - name: Server - test
        run: npm test
        working-directory: server

      - name: Client - install
        run: npm ci
        working-directory: client
      - name: Client - lint
        run: npm run lint
        working-directory: client
      - name: Client - test
        run: npm test
        working-directory: client
      - name: Client - build
        run: npm run build
        working-directory: client
