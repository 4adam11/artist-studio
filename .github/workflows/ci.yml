name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - install
        run: npm ci
        working-directory: server
      - name: Server - test
        run: npm test
        working-directory: server

      - name: Client - install
        run: npm ci
        working-directory: client
      - name: Client - lint
        run: npm run lint
        working-directory: client
      - name: Client - test
        run: npm test
        working-directory: client
      - name: Client - build
        run: npm run build
        working-directory: client

      - name: Ready-to-run copy (app/) is up to date
        run: |
          node scripts/package.mjs
          git diff --stat --exit-code -- app || (echo "app/ is out of date: run npm run package and commit the result" && exit 1)
      - name: Ready-to-run copy starts
        run: |
          NO_BROWSER=1 node app/start.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:5050/api/health && exit 0; sleep 1; done
          exit 1
